org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m
org.gradle.parallel=true
org.gradle.configureondemand=true
org.gradle.caching=true

android.useAndroidX=true
android.enableJetifier=true

# New Architecture disabled: stable interop path for the third-party natives
# (track-player 4.1.2, slider, rn-fs). Prevents device-specific startup crashes
# in release builds while keeping full RN 0.85 functionality.
# MUST be true on React Native 0.85.
#
# The RN Gradle plugin hardcodes the architecture and ignores this property:
#     internal fun Project.isNewArchEnabled(): Boolean = true
#     (@react-native/gradle-plugin .../utils/ProjectUtils.kt:34)
# Every native library is therefore COMPILED as Fabric + TurboModules regardless
# of what is written here. This value only feeds
# BuildConfig.IS_NEW_ARCHITECTURE_ENABLED, which MainApplication reports as
# isNewArchEnabled and uses to decide whether to call load().
#
# With this set to false the app contradicted itself: libraries built for the new
# architecture, host declaring legacy mode and skipping load(). Nothing in JS had
# run yet — that is the "opens, then instantly crashes" symptom, in BOTH the
# debug and the release APK.
newArchEnabled=true
hermesEnabled=true

RN_VERSION=0.85.1
